<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550"><rect width="1200" height="550" fill="#f6f3ed"/><g font-family="Arial,sans-serif" fill="#282a26"><text x="55" y="75" font-size="35" font-weight="700">От образца к решению о закупке</text><g font-size="20"><text x="55" y="160" fill="#994719">01 · ОБРАЗЕЦ</text><text x="635" y="160" fill="#994719">02 · УСЛОВИЯ</text><text x="55" y="335" fill="#994719">03 · ВПЕЧАТЛЕНИЯ</text><text x="635" y="335" fill="#994719">04 · ПАРТИЯ</text></g><g font-size="24"><text x="55" y="208">Название, год и маркировка.</text><text x="635" y="208">Одна вода, посуда и метод.</text><text x="55" y="383">Записать вкус и задачу покупателя.</text><text x="635" y="383">Подтвердить товар и условия.</text></g><g stroke="#d4cfc5"><path d="M55 120H1145M55 280H1145M55 470H1145"/></g><text x="55" y="515" font-size="17">Памятка покупателю · Не заменяет проверку качества и безопасности</text><text x="975" y="503" font-size="19" font-weight="700">PUERH</text><text x="975" y="525" font-size="19" fill="#994719" font-weight="700">DIRECT</text></g></svg>
